apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -prod
resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml
  - pvc.yaml
configMapGenerator:
  - name: mapproxy-configmap
    files:
      - mapproxy.yaml
      - seed.yaml
      - logging.ini
secretGenerator:
  - name: mapproxy-env
    type: Opaque
    envs:
      - .env
generatorOptions:
  disableNameSuffixHash: true
labels:
  - includeSelectors: true
    pairs:
      variant: prod
patches:
  - path: deployment_patch.yaml
  - path: deployment_hpa_patch.yaml
  - path: service_patch.yaml
images:
  - name: ghcr.io/dbca-wa/mapproxy
    newTag: 7.0.0-hotfix01
